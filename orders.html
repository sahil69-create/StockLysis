  <script>
    (function () {
      try {
        var mode = localStorage.getItem("stocklysis.mode") || "dark";
        var theme = localStorage.getItem("stocklysis.theme") || "blue";
        var html = document.documentElement;
        if (mode === "dark") html.classList.add("dark");
        else html.classList.remove("dark");
        html.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

                    <th class="py-3 px-4 text-center"><div class="flex items-center justify-center"><p class="font-medium text-gray-500 text-theme-xs dark:text-gray-400">Side</p></div></th>
                    <th class="py-3 px-4 text-right"><div class="flex items-center justify-end"><p class="font-medium text-gray-500 text-theme-xs dark:text-gray-400">Qty</p></div></th>
                    <th class="py-3 px-4 text-right"><div class="flex items-center justify-end"><p class="font-medium text-gray-500 text-theme-xs dark:text-gray-400">Price</p></div></th>
